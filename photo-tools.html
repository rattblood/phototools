const tabs=T.map(([id,name,bi])=>{
 const btn=document.createElement("button"),f=document.createElement("iframe");
 btn.textContent=name;f.title=name;nav.append(btn);fr.append(f);
 const open=()=>{tabs.forEach(t=>{t.btn.classList.toggle("on",t.btn===btn);t.f.classList.toggle("on",t.f===f)});

  try{history.replaceState(null,"","#"+id)}catch(e){}};
 btn.onclick=open;return{id,btn,f,open}});
(tabs.find(t=>"#"+t.id==location.hash)||tabs[0]).open();
